<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Tux as a silhouette. The badge is drawn as a CSS mask, so only the outline
       carries: no belly, no eyes. What makes it read at 22px is the head being
       clearly smaller than the body, the beak breaking the outline, and the feet
       splaying out past it. -->
