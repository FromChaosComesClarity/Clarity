    <ellipse cx="6.6" cy="20.8" rx="3.4" ry="1.5" transform="rotate(-28 6.6 20.8)"/>
    <ellipse cx="17.4" cy="20.8" rx="3.4" ry="1.5" transform="rotate(28 17.4 20.8)"/>
    <ellipse cx="12" cy="14.6" rx="5.6" ry="6.4"/>
    <ellipse cx="12" cy="6.2" rx="3.7" ry="4"/>
    <path d="M12 7.3c1.9 0 3.1.7 3.1 1.5S13.9 10.4 12 10.4 8.9 9.6 8.9 8.8 10.1 7.3 12 7.3z"/>
  </g>
</svg>
